name: WhisperMaster

options:
  bundleIdPrefix: app.whispermaster
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Inert — Resources/Info.plist is the authority (INFOPLIST_FILE below, with
    # GENERATE_INFOPLIST_FILE: NO, and literal version keys rather than
    # $(MARKETING_VERSION)). Kept in step with the plist anyway so nobody reads
    # 0.1.0 here and believes it, and so this stays harmless if a future target
    # ever does interpolate it.
    MARKETING_VERSION: "1.2.9-beta.2"
    CURRENT_PROJECT_VERSION: "1"
    # arm64-only (Apple Silicon). Matches the vendored arm64 ITN xcframework and
    # how Scripts/bundle.sh already builds (-destination arch=arm64).
    ARCHS: arm64

packages:
  # Pinned exactly: 0.15.x changed sliding-window finish()/splicing behavior and
  # coincided with vanished transcripts + cut-off sentences in the field.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: "0.14.7"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  # Product analytics (opt-in, anonymous). PostHog Cloud free tier; the app only
  # imports this in Analytics.swift, the single vendor seam.
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: "3.0.0"
  # On-device qwen cleanup (MLX). Pinned exact: the MLXLMCommon/ChatSession API
  # churns between minors; the service is written against 2.29.1.
  MLXSwiftExamples:
    url: https://github.com/ml-explore/mlx-swift-examples.git
    exactVersion: "2.29.1"
  # Clerk auth — the launch sign-in gate. Native macOS 14+ support.
  Clerk:
    url: https://github.com/clerk/clerk-ios.git
    from: "1.3.0"

targets:
  WhisperMaster:
    type: application
    platform: macOS
    sources:
      - path: Sources/WhisperMaster
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: FluidAudio
      - package: Sparkle
      - package: PostHog
        product: PostHog
      - package: MLXSwiftExamples
        product: MLXLLM
      - package: MLXSwiftExamples
        product: MLXLMCommon
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
    settings:
      base:
        PRODUCT_NAME: WhisperMaster
        PRODUCT_BUNDLE_IDENTIFIER: app.whispermaster.mac
        # PostHog key baked into Info.plist ($(POSTHOG_API_KEY)); empty by
        # default so an unset build stays analytics-dormant. bundle.sh overrides
        # it from .env / a CI secret.
        POSTHOG_API_KEY: ""
        # GA4 pair, same mechanism ($(GA_MEASUREMENT_ID)/$(GA_API_SECRET) in
        # Info.plist). Empty default = GA dormant. The API secret is write-only
        # to one GA data stream but IS extractable from a shipped .app — see
        # AnalyticsConfig.googleAPISecret before reusing it anywhere else.
        GA_MEASUREMENT_ID: ""
        GA_API_SECRET: ""
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        # Hardened runtime is required for Apple notarization. The entitlements
        # file declares only what the (non-sandboxed) app actually uses.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Resources/WhisperMaster.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

schemes:
  WhisperMaster:
    build:
      targets:
        WhisperMaster: all
    run:
      config: Debug
    archive:
      config: Release
