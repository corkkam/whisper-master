name: WhisperMaster

options:
  bundleIdPrefix: app.whispermaster
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    # There is deliberately NO MARKETING_VERSION / CURRENT_PROJECT_VERSION here.
    # Resources/Info.plist is the single version authority (INFOPLIST_FILE below,
    # with GENERATE_INFOPLIST_FILE: NO and literal version keys, never
    # $(MARKETING_VERSION)) — it is what the CI gate diffs, what release.sh reads,
    # and what the release tag is cut from. These two keys used to sit here as
    # inert copies "kept in step so nobody reads the wrong number", and they drifted
    # exactly as you would expect: they still said 1.2.10 long after versioning
    # restarted at 1.0.0 and the plist had moved to 1.1.0-beta.6, so the stale copy
    # was the *higher* number and read as the newer one. A second version source
    # that must be hand-synced is the bug; deleting it is the fix. Nothing reads
    # them — release.sh passes its own MARKETING_VERSION/CURRENT_PROJECT_VERSION
    # to the PostHog symbol uploader as environment variables, from the plist.
    # arm64-only (Apple Silicon). Matches the vendored arm64 ITN xcframework and
    # how Scripts/bundle.sh already builds (-destination arch=arm64).
    ARCHS: arm64
  configs:
    # Emit a dSYM for release builds so PostHog can symbolicate crash reports
    # server-side (Scripts/release.sh uploads it). Xcode's Release default is
    # already dwarf-with-dsym, but this is stated explicitly because it is
    # invisible when wrong: the build succeeds, the release ships, and every
    # crash arrives months later as unsymbolicated hex with nothing to read.
    # Debug stays `dwarf` — no dSYM, faster builds, and crash capture is off
    # under a debugger anyway.
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf

packages:
  # Pinned exactly. Was 0.14.7 because 0.15.0's sliding-window finish()/splicing
  # rewrite coincided with vanished transcripts + cut-off sentences in the field.
  # Bumped to 0.15.5, which carries the long-form splice fixes (#688, #689) and
  # re-tested clean against the audio bench (see Package.swift for detail). Keep
  # in step with Package.swift.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: "0.15.5"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  # Product analytics (opt-in, anonymous). PostHog Cloud free tier; the app only
  # imports this in Analytics.swift, the single vendor seam.
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: "3.0.0"
  # On-device qwen cleanup (MLX). Pinned exact: the MLXLMCommon/ChatSession API
  # churns between minors; the service is written against 2.29.1.
  MLXSwiftExamples:
    url: https://github.com/ml-explore/mlx-swift-examples.git
    exactVersion: "2.29.1"
  # Clerk auth — the launch sign-in gate. Native macOS 14+ support.
  Clerk:
    url: https://github.com/clerk/clerk-ios.git
    from: "1.3.0"

targets:
  WhisperMaster:
    type: application
    platform: macOS
    sources:
      - path: Sources/WhisperMaster
        # ⚠️ Every non-source file under here is copied into
        # Contents/Resources/ with its basename, so the per-directory CLAUDE.md
        # files all target the same destination and xcodebuild fails the build
        # with "duplicate output file" (exit 65). They are agent documentation,
        # not app resources — a shipped bundle should not carry them either.
        excludes:
          - "**/CLAUDE.md"
      - path: Resources/AppIcon.icns
        buildPhase: resources
      # The eval's mechanical scorer, compiled into the app so the Model Lab can
      # grade a bench in-process. SwiftPM builds the same files as the
      # `EvalScoreKit` module (Package.swift) and the Lab sources import it under
      # `#if SWIFT_PACKAGE`; here they are in-module, so there is nothing to
      # import and still only one copy of the code.
      - path: eval/text-cleanup/EvalScore
    dependencies:
      - package: FluidAudio
      - package: Sparkle
      - package: PostHog
        product: PostHog
      - package: MLXSwiftExamples
        product: MLXLLM
      - package: MLXSwiftExamples
        product: MLXLMCommon
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
    settings:
      base:
        PRODUCT_NAME: WhisperMaster
        PRODUCT_BUNDLE_IDENTIFIER: app.whispermaster.mac
        # PostHog key baked into Info.plist ($(POSTHOG_API_KEY)); empty by
        # default so an unset build stays analytics-dormant. bundle.sh overrides
        # it from .env / a CI secret.
        POSTHOG_API_KEY: ""
        # GA4 pair, same mechanism ($(GA_MEASUREMENT_ID)/$(GA_API_SECRET) in
        # Info.plist). Empty default = GA dormant. The API secret is write-only
        # to one GA data stream but IS extractable from a shipped .app — see
        # AnalyticsConfig.googleAPISecret before reusing it anywhere else.
        GA_MEASUREMENT_ID: ""
        GA_API_SECRET: ""
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        # Hardened runtime is required for Apple notarization. The entitlements
        # file declares only what the (non-sandboxed) app actually uses.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Resources/WhisperMaster.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

schemes:
  WhisperMaster:
    build:
      targets:
        WhisperMaster: all
    run:
      config: Debug
    archive:
      config: Release
