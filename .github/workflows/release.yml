name: Release to R2

# Pushes to dev that BUMP CFBundleShortVersionString build, sign, notarize, and
# ship a Sparkle update to the R2 feed. Ordinary pushes (code, fixes, docs) only
# run the cheap Ubuntu gate below and cost ~nothing — the macOS runner (billed
# ~10x, made longer by the Apple notary wait) is reserved for actual releases.
# Force a release without a version change via the manual "Run workflow" button.
# Put [skip release] in the commit message to skip even a version-bump push.
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap gate: did the marketing version change in this push? Runs on Ubuntu
  # (1x billing, seconds) so non-release pushes never spin up a macOS runner.
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -e
          ver() { python3 -c "import plistlib,sys;print(plistlib.load(open(sys.argv[1],'rb'))['CFBundleShortVersionString'])" "$1"; }
          cur="$(ver Resources/Info.plist)"
          # Manual runs always release; so does the first push with no base ref.
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "current=$cur, manual/first run -> release"
            echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git cat-file -e "$BEFORE:Resources/Info.plist" 2>/dev/null; then
            git show "$BEFORE:Resources/Info.plist" > /tmp/prev.plist
            prev="$(ver /tmp/prev.plist)"
          else
            prev="(none)"
          fi
          echo "current=$cur previous=$prev"
          if [ "$cur" != "$prev" ]; then
            echo "version bumped -> release"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version unchanged -> skip (no macOS minutes spent)"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: gate
    if: ${{ needs.gate.outputs.release == 'true' && !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: macos-15
    permissions:
      contents: write   # push the v<version> release tag
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so the Telegram step can build release notes
          # spanning everything since the previous release tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install build tools
        run: brew install xcodegen rclone

      - name: Import Developer ID signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Put the build keychain at the front of the search list so codesign finds the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Set CI build number
        # Epoch seconds: strictly increasing and always larger than any prior
        # build (incl. earlier manual `release.sh` builds), so Sparkle always
        # treats a fresh CI build as newer. `github.run_number` was too small
        # and got undercut by manual builds.
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $(date +%s)" Resources/Info.plist

      - name: Write notary API key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary_key.p8"
          echo "NOTARY_KEY_P8=$RUNNER_TEMP/notary_key.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, generate appcast, upload to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: bash Scripts/release.sh

      - name: Announce release on Telegram
        # Only after a successful upload. No-ops (exit 0) if the Telegram secrets
        # aren't configured. continue-on-error so a notification hiccup never
        # fails the release (or skips the release-tag step below). Posts the
        # release commit message and attaches the built app zip.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          RANGE_BEFORE: ${{ github.event.before }}
          RANGE_AFTER: ${{ github.sha }}
        run: python3 Scripts/notify-telegram.py

      - name: Tag the release
        # Runs after the announcement so this release's own tag doesn't shrink
        # its notes range. The tag becomes the baseline for the NEXT release's
        # "everything since last release" notes. Idempotent; ignored by the
        # push trigger (branches-only), so it can't loop.
        run: |
          set -euo pipefail
          VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if git rev-parse "v$VER" >/dev/null 2>&1; then
            echo "tag v$VER already exists; skipping"
            exit 0
          fi
          git tag "v$VER" "${{ github.sha }}"
          git push origin "v$VER"
