name: Release to R2

# Version-bump pushes build, sign, notarize, and ship a Sparkle update to R2.
# Branch → channel mapping (see Scripts/channel.sh):
#   push to dev  → CHANNEL=dev    → appcast-dev.xml + WhisperMaster-dev.dmg
#   push to main → CHANNEL=stable → appcast.xml     + WhisperMaster.dmg
# (Beta is a separate MANUAL flow: CHANNEL=beta bash Scripts/release.sh.)
# Ordinary pushes (code, fixes, docs) only run the cheap Ubuntu gate below and
# cost ~nothing — the macOS runner (billed ~10x, made longer by the Apple notary
# wait) is reserved for actual releases. Force a release without a version change
# via the manual "Run workflow" button. Put [skip release] in the commit message
# to skip even a version-bump push.
on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. The release job below re-grants `contents: write`
# for the release-tag push, so this only narrows the read-only gate job.
permissions:
  contents: read

jobs:
  # Cheap gate: did the marketing version change in this push? Runs on Ubuntu
  # (1x billing, seconds) so non-release pushes never spin up a macOS runner.
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: check
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -e
          ver() { python3 -c "import plistlib,sys;print(plistlib.load(open(sys.argv[1],'rb'))['CFBundleShortVersionString'])" "$1"; }
          cur="$(ver Resources/Info.plist)"
          # Manual runs always release; so does the first push with no base ref.
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "current=$cur, manual/first run -> release"
            echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git cat-file -e "$BEFORE:Resources/Info.plist" 2>/dev/null; then
            git show "$BEFORE:Resources/Info.plist" > /tmp/prev.plist
            prev="$(ver /tmp/prev.plist)"
          else
            prev="(none)"
          fi
          echo "current=$cur previous=$prev"
          if [ "$cur" != "$prev" ]; then
            echo "version bumped -> release"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version unchanged -> skip (no macOS minutes spent)"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: gate
    if: ${{ needs.gate.outputs.release == 'true' && !contains(github.event.head_commit.message, '[skip release]') }}
    # macos-26 (arm64), whose default Xcode is 26.6 — the same toolchain the app
    # is developed against. NOT macos-15: its Xcode is 16.4, which cannot resolve
    # this project's package graph at all, so every release job died in
    # `xcodebuild -resolvePackageDependencies` with a bare "Could not resolve
    # package dependencies:" and no reason (bundle.sh keeps the detail in
    # build/xcodebuild-Release.log, which the runner never uploads). That is why
    # 1.2.9 and 1.2.10 both had to be cut by hand from a local checkout. Keep
    # this image at the major Xcode the project actually builds with.
    runs-on: macos-26
    # Holds the job until the `corkkam` owner approves it in the Actions tab, so
    # no merge can ship a signed, notarized update on its own. The environment
    # (Settings > Environments > release) has corkkam as required reviewer and
    # only accepts protected branches.
    environment: release
    permissions:
      contents: write   # push the v<version> release tag
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history + tags so the Telegram step can build release notes
          # spanning everything since the previous release tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install build tools
        run: brew install xcodegen rclone

      - name: Import Developer ID signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Put the build keychain at the front of the search list so codesign finds the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Set CI build number
        # Epoch seconds: strictly increasing and always larger than any prior
        # build (incl. earlier manual `release.sh` builds), so Sparkle always
        # treats a fresh CI build as newer. `github.run_number` was too small
        # and got undercut by manual builds.
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $(date +%s)" Resources/Info.plist

      - name: Resolve release channel from branch
        # dev branch → dev channel; main branch → stable channel. Exported to
        # $GITHUB_ENV so channel.sh (sourced by release.sh / publish-dmg.sh)
        # picks it up. release.sh enforces that the dev channel's version carries
        # a `-dev.N` pre-release tag, so a dev build can never overwrite a stable
        # archive at the R2 bucket root.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$REF_NAME" in
            main) CHANNEL=stable ;;
            dev)  CHANNEL=dev ;;
            *)    echo "error: release branch '$REF_NAME' has no channel mapping" >&2; exit 1 ;;
          esac
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo ">> Releasing on the $CHANNEL channel (branch $REF_NAME)"

      - name: Write notary API key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary_key.p8"
          echo "NOTARY_KEY_P8=$RUNNER_TEMP/notary_key.p8" >> "$GITHUB_ENV"

      - name: Install PostHog CLI (dSYM symbolication)
        # release.sh's upload step shells out to the uploader vendored in the
        # posthog-ios checkout, which requires this binary on PATH. Guarded on
        # the secret rather than `if:` so a fork or an unconfigured repo skips it
        # with an explanation instead of failing the release.
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${POSTHOG_CLI_API_KEY:-}" ]]; then
            # Pinned (was @latest): a floating tag pulls whatever version resolves
            # at release time. Bump deliberately. NOTE: this package's postinstall
            # (node ./install.js) downloads its platform binary, so --ignore-scripts
            # is NOT usable here — it would leave `posthog-cli` with no executable.
            npm install -g @posthog/cli@0.11.1
            posthog-cli --version
          else
            echo "POSTHOG_CLI_API_KEY unset — skipping CLI install; dSYMs will not be uploaded."
          fi

      - name: Build, sign, notarize, generate appcast, upload to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          # Baked into Info.plist by bundle.sh so shipped builds have analytics.
          # Publishable client key, not a real secret; add it as a repo secret.
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          # GA4 Measurement Protocol pair. The measurement ID is public; the API
          # secret ships in the bundle and is extractable, so keep it on a data
          # stream of its own that can be revoked without touching the website's
          # analytics. Missing secrets just leave GA off in the build.
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          GA_API_SECRET: ${{ secrets.GA_API_SECRET }}
          # dSYM upload for native crash symbolication. NOT shipped in the app
          # and NOT publishable — a personal API key, scoped to
          # `error_tracking:write` only. Missing secrets skip the upload with a
          # loud warning; the release still ships, but its crashes are
          # permanently unsymbolicated (the dSYM dies with the runner).
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
          # Publishes this build's eval score to whisper.corkkam.com/eval,
          # tagged with the version and channel. release.sh runs the eval last
          # and never lets it fail the release, so a missing or wrong token
          # costs the score for this version and nothing else.
          #
          # STABLE ONLY, and it is not free: the eval launches the built app,
          # which downloads the ~2 GB cleanup model onto a fresh runner and then
          # runs 89 cases twice. Reckon on ten extra macOS-runner minutes per
          # release, billed at 10x. release.sh already defaults the dev channel
          # off; RUN_EVAL below is the switch if stable should stop paying for
          # it too.
          EVAL_INGEST_TOKEN: ${{ secrets.EVAL_INGEST_TOKEN }}
          RUN_EVAL: ${{ github.ref_name == 'main' && '1' || '0' }}
        run: bash Scripts/release.sh

      - name: Publish shareable DMG to R2
        # Reuses the app release.sh already built + notarized + stapled, wraps it
        # in a notarized DMG, and uploads it to a STABLE link
        # (…/WhisperMaster.dmg, always the newest) plus a versioned copy — so
        # there's always a warning-free direct-download link to hand out.
        # notarize.sh skips the already-stapled app, so only the DMG itself pays
        # a notary round-trip. NOTARY_KEY_P8 is already in $GITHUB_ENV.
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: bash Scripts/publish-dmg.sh

      - name: Publish What's New manifest to R2
        # The release notes + demo video the app shows after a Sparkle update
        # relaunches it on a newer version. Validates whats-new.json, then
        # uploads it to <bucket>/whats-new.json.
        #
        # ONE MANIFEST FOR ALL THREE CHANNELS — unlike the appcasts, this is not
        # per-channel: a beta and a stable build at the same version show the
        # same note. So it runs on every channel and uploads to the same key.
        #
        # Runs AFTER the DMG so a validation failure here can never cost the
        # release itself: by this point the archive, appcast and DMG are already
        # published and users can update. Deliberately NOT continue-on-error —
        # a malformed manifest is invisible in the field (the app degrades to
        # showing nothing), so CI is the only place it can be caught, and a red
        # job is the whole point.
        #
        # Media (video/poster) is uploaded out of band by hand via
        # Scripts/upload-whats-new-media.sh — CI has no video to publish.
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          # NOTE: R2_PUBLIC_BASE_URL is deliberately NOT passed. That secret is
          # stale (it still names a retired r2.dev host) while the app hardcodes
          # dl.corkkam.com; nothing here may build a user-visible URL from it.
        run: bash Scripts/publish-whats-new.sh

      - name: Announce release on Telegram
        # Only after a successful upload, and only for STABLE (main-branch)
        # releases — dev-channel builds are internal and must not post to the
        # public group. No-ops (exit 0) if the Telegram secrets aren't
        # configured. continue-on-error so a notification hiccup never fails the
        # release (or skips the release-tag step below). Posts the release commit
        # message and attaches the built app zip. Put [skip announce] in the
        # commit message to release without posting.
        if: ${{ env.CHANNEL == 'stable' && !contains(github.event.head_commit.message, '[skip announce]') }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          RANGE_BEFORE: ${{ github.event.before }}
          RANGE_AFTER: ${{ github.sha }}
        run: python3 Scripts/notify-telegram.py

      - name: Tag the release
        # Runs after the announcement so this release's own tag doesn't shrink
        # its notes range. The tag becomes the baseline for the NEXT release's
        # "everything since last release" notes. Idempotent; ignored by the
        # push trigger (branches-only), so it can't loop.
        run: |
          set -euo pipefail
          VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if git rev-parse "v$VER" >/dev/null 2>&1; then
            echo "tag v$VER already exists; skipping"
            exit 0
          fi
          git tag "v$VER" "${{ github.sha }}"
          git push origin "v$VER"

      - name: Remove notary API key
        # Mirror the signing-cert cleanup (rm -f "$RUNNER_TEMP/cert.p12") for the
        # decoded .p8 so no later step on the runner can read it. `if: always()`
        # so it runs even when an earlier step fails.
        if: always()
        run: rm -f "$RUNNER_TEMP/notary_key.p8"
